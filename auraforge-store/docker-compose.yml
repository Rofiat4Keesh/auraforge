# Local MongoDB for development.
# Prisma needs MongoDB to run as a "replica set" (even a single-node one),
# so this container starts mongod with --replSet and initialises it automatically.
#
#   docker compose up -d        # start
#   docker compose down         # stop (data is kept in the "mongo-data" volume)

services:
  mongo:
    image: mongo:7
    container_name: auraforge-mongo
    command: ["--replSet", "rs0", "--bind_ip_all", "--port", "27017"]
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: >
        mongosh --quiet --eval "try { rs.status().ok } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'localhost:27017'}]}).ok }"
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 5s
    restart: unless-stopped

volumes:
  mongo-data:
